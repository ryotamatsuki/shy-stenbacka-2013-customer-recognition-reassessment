name: manuscript-build

on:
  pull_request:
  workflow_dispatch:

jobs:
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install table-generation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Generate deterministic tables
        run: python code/generate_tables.py
      - name: Stage 14 submission consistency checks
        run: python code/stage14_submission_checks.py
      - name: Build manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: manuscript
      - name: Reject unresolved references or citations
        run: |
          if grep -nE 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references' manuscript/main.log; then
            echo "Unresolved manuscript reference/citation"
            exit 1
          fi
      - name: Build submission bundle
        run: |
          rm -rf submission_bundle
          mkdir -p submission_bundle/manuscript/sections submission_bundle/manuscript/generated submission_bundle/submission
          cp manuscript/main.pdf submission_bundle/manuscript/
          cp manuscript/main.tex manuscript/references.bib submission_bundle/manuscript/
          cp manuscript/sections/*.tex submission_bundle/manuscript/sections/
          cp manuscript/generated/*.tex submission_bundle/manuscript/generated/
          cp submission/title_page.md submission/cover_letter.md submission/highlights.txt submission/declarations.md submission_bundle/submission/
          tar -czf iep_submission_bundle.tar.gz submission_bundle
      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: manuscript/main.pdf
          if-no-files-found: error
      - name: Upload submission bundle
        uses: actions/upload-artifact@v4
        with:
          name: iep-submission-bundle
          path: iep_submission_bundle.tar.gz
          if-no-files-found: error
