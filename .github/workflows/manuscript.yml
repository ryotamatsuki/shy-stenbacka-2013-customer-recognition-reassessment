name: manuscript-build

on:
  pull_request:
  workflow_dispatch:

jobs:
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install table-generation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Generate deterministic tables
        run: python code/generate_tables.py
      - name: Build manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: manuscript
      - name: Reject unresolved references or citations
        run: |
          if grep -nE 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references' manuscript/main.log; then
            echo "Unresolved manuscript reference/citation"
            exit 1
          fi
      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: manuscript/main.pdf
          if-no-files-found: error
